<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Moodle Fields Suite</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Three form fields: a label dot and an input bar each. -->
  <g fill="#ffffff">
    <circle cx="140" cy="148" r="28"/>
    <rect x="196" y="120" width="196" height="56" rx="28"/>
    <circle cx="140" cy="256" r="28"/>
    <rect x="196" y="228" width="196" height="56" rx="28"/>
    <circle cx="140" cy="364" r="28" fill-opacity="0.55"/>
    <rect x="196" y="336" width="112" height="56" rx="28" fill-opacity="0.55"/>
  </g>
  <!-- A new field being added. -->
  <g stroke="#ffffff" stroke-width="22" stroke-linecap="round">
    <line x1="364" y1="332" x2="364" y2="396"/>
    <line x1="332" y1="364" x2="396" y2="364"/>
  </g>
</svg>
